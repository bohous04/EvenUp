# Maestro E2E for EvenUp mobile (PRD §10.1). Runs on iOS Simulator + Android
# Emulator in CI. Assumes a test build pointed at a staging API with a seeded
# account (EMAIL/PASSWORD env) and at least one group, or a fresh sign-up with
# AUTH_DEV_ECHO so email verification is auto-completed.
appId: company.lnrt.evenup
---
- launchApp:
    clearState: true

# --- Sign in (email + password) ---
- assertVisible: 'EvenUp'
- tapOn:
    id: 'Email'
- inputText: '${EMAIL}'
- tapOn:
    id: 'Password'
- inputText: '${PASSWORD}'
- tapOn:
    id: 'signin-submit'

# --- Groups tab: open the first group ---
- assertVisible:
    id: 'Groups'
- tapOn:
    id: 'group-row'
    index: 0

# --- Add an expense via the full form ---
- tapOn: 'Add expense'
- tapOn:
    id: 'expense-title'
- inputText: 'Chata'
- tapOn:
    id: 'expense-amount'
- inputText: '900'
- tapOn:
    id: 'expense-save'

# --- Back on the group: balances recomputed ---
# Asserted by testID, not the "Balances" heading: card section headers render
# through `SectionLabel`, which applies `textTransform: 'uppercase'`, so the
# visible text is "BALANCES" and a literal match would fail.
- assertVisible:
    id: 'balance-row'

# --- Settle a suggested payment (opens the settle sheet) ---
- runFlow:
    when:
      visible:
        id: 'settle-btn'
    commands:
      - tapOn:
          id: 'settle-btn'
          index: 0
      - assertVisible:
          id: 'settle-confirm'
      - tapOn:
          id: 'settle-confirm'
